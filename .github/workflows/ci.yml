name: tests

on:
  push:
  pull_request:

# The tests need no field data: they check the command lines and the decoder and run the comparison generators on a
# synthetic profile, with the CPU build of PyTorch.
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.14"
            torch: "2.12.0"
          - os: windows-latest
            python-version: "3.10"
            torch: "2.9.0"
          - os: ubuntu-latest
            python-version: "3.14"
            torch: "2.12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
